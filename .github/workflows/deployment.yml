name: Deployment
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: clone code
        uses: actions/checkout@v7
      - name: install dependency
        run: npm ci
      - name: lint the code
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: clone code
        uses: actions/checkout@v7
      - name: install dependency
        run: npm ci
      - name: test the code
        run: npm run test
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: clone code
        uses: actions/checkout@v7
      - name: install dependency
        run: npm ci
      - name: build the code
        run: npm run build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: clone code
        uses: actions/checkout@v7
      - name: deploy the code to server
        run: echo "deploying to server ..."
